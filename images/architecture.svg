<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1400"
  height="780"
  viewBox="0 0 1400 780"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">
    TypeScript CSV API Enricher Architecture
  </title>

  <desc id="description">
    Supplier CSV data is imported through a browser interface,
    validated, exported as a validation report, enriched through
    a Node.js server and external country API, and exported as an
    enriched supplier CSV file.
  </desc>

  <defs>
    <marker
      id="arrowhead"
      markerWidth="10"
      markerHeight="10"
      refX="9"
      refY="5"
      orient="auto"
    >
      <path
        d="M0 0 L10 5 L0 10 Z"
        fill="#7a8799"
      />
    </marker>

    <style>
      .title {
        font-family: Arial, sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #172033;
      }

      .section {
        font-family: Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #2f6fed;
      }

      .box-title {
        font-family: Arial, sans-serif;
        font-size: 19px;
        font-weight: 700;
        fill: #172033;
      }

      .box-text {
        font-family: Arial, sans-serif;
        font-size: 14px;
        fill: #5f6b7f;
      }

      .pill-text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #8a4b12;
      }

      .status-text {
        font-family: Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #ffffff;
      }

      .footer {
        font-family: Arial, sans-serif;
        font-size: 16px;
        fill: #566274;
      }

      .arrow {
        stroke: #7a8799;
        stroke-width: 3;
        fill: none;
        marker-end: url(#arrowhead);
      }

      .branch {
        stroke: #9aa7b8;
        stroke-width: 2.5;
        stroke-dasharray: 7 6;
        fill: none;
        marker-end: url(#arrowhead);
      }
    </style>
  </defs>

  <rect
    width="1400"
    height="780"
    fill="#f7f9fc"
  />

  <text
    x="700"
    y="58"
    text-anchor="middle"
    class="title"
  >
    TypeScript CSV API Enricher Architecture
  </text>

  <!-- INPUT -->
  <text x="70" y="120" class="section">INPUT</text>

  <rect
    x="60"
    y="140"
    width="210"
    height="120"
    rx="18"
    fill="#eef4ff"
    stroke="#7da4f5"
    stroke-width="2"
  />

  <text
    x="165"
    y="185"
    text-anchor="middle"
    class="box-title"
  >
    Supplier CSV
  </text>

  <text
    x="165"
    y="215"
    text-anchor="middle"
    class="box-text"
  >
    Business master data
  </text>

  <text
    x="165"
    y="238"
    text-anchor="middle"
    class="box-text"
  >
    selected by the user
  </text>

  <line
    x1="270"
    y1="200"
    x2="335"
    y2="200"
    class="arrow"
  />

  <!-- WEB INTERFACE -->
  <text x="355" y="120" class="section">WEB INTERFACE</text>

  <rect
    x="345"
    y="140"
    width="240"
    height="120"
    rx="18"
    fill="#ffffff"
    stroke="#9fb3ca"
    stroke-width="2"
  />

  <text
    x="465"
    y="180"
    text-anchor="middle"
    class="box-title"
  >
    Browser Web UI
  </text>

  <text
    x="465"
    y="210"
    text-anchor="middle"
    class="box-text"
  >
    File selection
  </text>

  <text
    x="465"
    y="233"
    text-anchor="middle"
    class="box-text"
  >
    Validation and export workflow
  </text>

  <line
    x1="585"
    y1="200"
    x2="650"
    y2="200"
    class="arrow"
  />

  <!-- VALIDATION -->
  <text x="670" y="120" class="section">VALIDATION</text>

  <rect
    x="660"
    y="140"
    width="290"
    height="185"
    rx="18"
    fill="#fff7ed"
    stroke="#f0a35e"
    stroke-width="2"
  />

  <text
    x="805"
    y="180"
    text-anchor="middle"
    class="box-title"
  >
    Validation Engine
  </text>

  <rect
    x="690"
    y="200"
    width="230"
    height="26"
    rx="13"
    fill="#fff2e6"
    stroke="#efb47b"
  />

  <text
    x="805"
    y="218"
    text-anchor="middle"
    class="pill-text"
  >
    Required Value Validation
  </text>

  <rect
    x="690"
    y="234"
    width="230"
    height="26"
    rx="13"
    fill="#fff2e6"
    stroke="#efb47b"
  />

  <text
    x="805"
    y="252"
    text-anchor="middle"
    class="pill-text"
  >
    Duplicate Supplier Detection
  </text>

  <rect
    x="690"
    y="268"
    width="230"
    height="26"
    rx="13"
    fill="#fff2e6"
    stroke="#efb47b"
  />

  <text
    x="805"
    y="286"
    text-anchor="middle"
    class="pill-text"
  >
    Email and Country Code Validation
  </text>

  <line
    x1="950"
    y1="225"
    x2="1015"
    y2="225"
    class="arrow"
  />

  <!-- SERVER -->
  <text x="1035" y="120" class="section">SERVER</text>

  <rect
    x="1025"
    y="140"
    width="260"
    height="170"
    rx="18"
    fill="#eefaf7"
    stroke="#55b9a5"
    stroke-width="2"
  />

  <text
    x="1155"
    y="180"
    text-anchor="middle"
    class="box-title"
  >
    Node.js Server
  </text>

  <text
    x="1155"
    y="212"
    text-anchor="middle"
    class="box-text"
  >
    Serves the web application
  </text>

  <text
    x="1155"
    y="237"
    text-anchor="middle"
    class="box-text"
  >
    Provides internal API endpoints
  </text>

  <text
    x="1155"
    y="262"
    text-anchor="middle"
    class="box-text"
  >
    Normalizes external responses
  </text>

  <!-- VALIDATION REPORT -->
  <path
    d="M805 325 L805 390 L1080 390"
    class="branch"
  />

  <rect
    x="1080"
    y="340"
    width="250"
    height="105"
    rx="18"
    fill="#fff1f0"
    stroke="#e58b83"
    stroke-width="2"
  />

  <text
    x="1205"
    y="380"
    text-anchor="middle"
    class="box-title"
  >
    Validation Report
  </text>

  <text
    x="1205"
    y="410"
    text-anchor="middle"
    class="box-text"
  >
    Excel-compatible CSV
  </text>

  <!-- SERVER TO API -->
  <line
    x1="1155"
    y1="310"
    x2="1155"
    y2="495"
    class="arrow"
  />

  <!-- EXTERNAL DATA -->
  <text x="1025" y="490" class="section">EXTERNAL DATA</text>

  <rect
    x="1025"
    y="510"
    width="260"
    height="120"
    rx="18"
    fill="#ecf8fb"
    stroke="#63b8c9"
    stroke-width="2"
  />

  <text
    x="1155"
    y="550"
    text-anchor="middle"
    class="box-title"
  >
    Country API
  </text>

  <text
    x="1155"
    y="580"
    text-anchor="middle"
    class="box-text"
  >
    Country and regional information
  </text>

  <text
    x="1155"
    y="604"
    text-anchor="middle"
    class="box-text"
  >
    retrieved by ISO country code
  </text>

  <line
    x1="1025"
    y1="570"
    x2="900"
    y2="570"
    class="arrow"
  />

  <!-- ENRICHMENT -->
  <text x="610" y="490" class="section">DATA ENRICHMENT</text>

  <rect
    x="600"
    y="510"
    width="300"
    height="165"
    rx="18"
    fill="#f3efff"
    stroke="#9d83db"
    stroke-width="2"
  />

  <text
    x="750"
    y="550"
    text-anchor="middle"
    class="box-title"
  >
    Supplier Enrichment
  </text>

  <text
    x="750"
    y="582"
    text-anchor="middle"
    class="box-text"
  >
    Country name · Region · Income level
  </text>

  <text
    x="750"
    y="607"
    text-anchor="middle"
    class="box-text"
  >
    Capital city · Longitude · Latitude
  </text>

  <rect
    x="670"
    y="632"
    width="160"
    height="24"
    rx="12"
    fill="#087f6f"
  />

  <text
    x="750"
    y="648"
    text-anchor="middle"
    class="status-text"
  >
    Per-record status
  </text>

  <line
    x1="600"
    y1="590"
    x2="495"
    y2="590"
    class="arrow"
  />

  <!-- OUTPUT -->
  <text x="175" y="490" class="section">OUTPUT</text>

  <rect
    x="165"
    y="510"
    width="330"
    height="165"
    rx="18"
    fill="#edf9f1"
    stroke="#67b981"
    stroke-width="2"
  />

  <text
    x="330"
    y="550"
    text-anchor="middle"
    class="box-title"
  >
    Enriched Supplier CSV
  </text>

  <text
    x="330"
    y="582"
    text-anchor="middle"
    class="box-text"
  >
    Original supplier data
  </text>

  <text
    x="330"
    y="607"
    text-anchor="middle"
    class="box-text"
  >
    plus normalized country information
  </text>

  <text
    x="330"
    y="632"
    text-anchor="middle"
    class="box-text"
  >
    and enrichment status
  </text>

  <text
    x="700"
    y="735"
    text-anchor="middle"
    class="footer"
  >
    CSV Import → Validation → Reporting → API Integration → Data Enrichment → CSV Export
  </text>
</svg>